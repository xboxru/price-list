name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: "0 2 * * *" # раз в сутки обновляем прайс-зависимые обложки

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build site
        run: npm run build

      - name: Restore covers cache
        uses: actions/cache@v4
        with:
          path: .covers-cache
          key: covers-${{ github.run_id }}
          restore-keys: covers-

      - name: Build game covers
        timeout-minutes: 30
        continue-on-error: true
        env:
          RAWG_KEY: ${{ secrets.RAWG_KEY }}
          SITE_URL_OVERRIDE: ${{ vars.SITE_URL }}
        run: |
          export SITE_URL="${SITE_URL_OVERRIDE:-https://${GITHUB_REPOSITORY_OWNER,,}.github.io/${GITHUB_REPOSITORY#*/}/}"
          node --experimental-strip-types scripts/build-covers.mjs dist/game-covers
          ls -la dist/game-covers | head -5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
